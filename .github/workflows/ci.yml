name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Exercise npm 12 install-script policy
        run: npm install --global npm@12
      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential python3
      - name: Validate installer and bootstrap syntax
        run: bash -n install.sh scripts/bootstrap.sh
      - name: Prepare dependencies through bootstrap
        env:
          LUMA_USE_SYSTEM_NODE: '1'
        run: bash scripts/bootstrap.sh setup --force
      - name: Run source checks through bootstrap
        env:
          LUMA_USE_SYSTEM_NODE: '1'
        run: bash scripts/bootstrap.sh ci
      - name: Package AppImage
        run: npx electron-builder --linux AppImage --publish never
      - name: Create SHA-256 manifest
        if: github.event_name == 'push'
        run: |
          cd dist
          sha256sum *.AppImage > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: luma-linux-${{ github.sha }}
          path: |
            dist/*.AppImage
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
      - name: Publish ready-to-install nightly release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Luma Nightly
          prerelease: true
          make_latest: false
          target_commitish: main
          body: |
            Rolling Linux x86_64 build from `main`.

            Install or update with:
            `bash -c "$(curl -fsSL https://raw.githubusercontent.com/drainedgodw/Luma/main/install.sh)"`
          files: |
            dist/*.AppImage
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
