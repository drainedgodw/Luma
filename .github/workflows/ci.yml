name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Exercise npm 12 install-script policy
        run: npm install --global npm@12
      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential python3
      - name: Validate bootstrap syntax
        run: bash -n scripts/bootstrap.sh
      - name: Prepare dependencies through bootstrap
        env:
          LUMA_USE_SYSTEM_NODE: '1'
        run: bash scripts/bootstrap.sh setup --force
      - name: Run source checks through bootstrap
        env:
          LUMA_USE_SYSTEM_NODE: '1'
        run: bash scripts/bootstrap.sh ci
      - name: Package AppImage smoke build
        run: npx electron-builder --linux AppImage --publish never
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: luma-linux-${{ github.sha }}
          path: dist/*.AppImage
          if-no-files-found: error
          retention-days: 7
