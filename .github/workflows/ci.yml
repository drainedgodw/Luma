name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  issues: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install native build tools
        if: github.event_name == 'push'
        run: sudo apt-get update && sudo apt-get install -y build-essential python3
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Rebuild native modules for Electron
        if: github.event_name == 'push'
        run: npx electron-rebuild --force --which-module node-pty
      - name: Package test AppImage
        id: package
        if: github.event_name == 'push'
        continue-on-error: true
        run: |
          set -o pipefail
          npx electron-builder --linux AppImage --publish never 2>&1 | tee packaging.log
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && steps.package.outcome == 'success'
        with:
          name: luma-linux-${{ github.sha }}
          path: dist/*.AppImage
          if-no-files-found: error
          retention-days: 7
      - name: Report packaging failure
        if: github.event_name == 'push' && steps.package.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf 'Automated diagnostic for commit `%s`.\n\n```text\n' "$GITHUB_SHA" > issue.md
          tail -n 100 packaging.log >> issue.md
          printf '\n```\n' >> issue.md
          gh issue create --title "CI diagnostic: AppImage packaging failure" --body-file issue.md
          exit 1
