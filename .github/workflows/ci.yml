name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Exercise npm 12 install-script policy
        run: npm install --global npm@12
      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential python3
      - run: npm ci --strict-allow-scripts
      - run: npm run doctor
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Rebuild native modules for Electron
        run: npx electron-rebuild --force --which-module node-pty
      - name: Package AppImage smoke build
        run: npx electron-builder --linux AppImage --publish never
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: luma-linux-${{ github.sha }}
          path: dist/*.AppImage
          if-no-files-found: error
          retention-days: 7
