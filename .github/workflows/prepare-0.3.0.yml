name: Prepare Luma 0.3.0 metadata

on:
  push:
    branches: [feat/stack-package-actions]
    paths:
      - .github/workflows/prepare-0.3.0.yml
      - scripts/prepare-0.3.0.mjs

permissions:
  contents: write

jobs:
  prepare-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/prepare-0.3.0.mjs
      - name: Commit synchronized metadata
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json update.json CHANGELOG.md README.md src/renderer/src/views/SettingsView.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'chore: mark Stack update as Luma 0.3.0'
          git push
